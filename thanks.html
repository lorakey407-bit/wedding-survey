<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спасибо! — Алёна & Роман</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #1A0310 0%, #3D0A1F 35%, #6B1F38 65%, #3A0D1A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
    }
    .icon { font-size: 72px; margin-bottom: 24px; display: block; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-style: italic;
      color: #E8CC7A;
      margin-bottom: 16px;
    }
    .rings { margin-bottom: 24px; }
    p {
      font-size: 18px;
      font-weight: 300;
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .date {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C9A84C;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">💌</span>
    <svg class="rings" width="70" height="42" viewBox="0 0 80 48" fill="none">
      <circle cx="24" cy="24" r="20" stroke="#C9A84C" stroke-width="2.5" fill="none"/>
      <circle cx="56" cy="24" r="20" stroke="#C9A84C" stroke-width="2.5" fill="none"/>
    </svg>
    <h1>Спасибо!</h1>
    <p>Ваши предпочтения успешно записаны.<br>Мы обо всём позаботимся — ждём вас на торжестве! 🥂</p>
    <p class="date">🌹 Алёна & Роман · 05 сентября 2026</p>
  </div>
</body>
</html>
